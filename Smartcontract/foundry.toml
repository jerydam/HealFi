[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
via_ir = true
optimizer = true
optimizer_runs = 200
# Each network needs its own inline table with `key` (the API key, pulled from
# an env var - never hardcode it) and `url` (the explorer's verify endpoint).
# Your original file put a URL where the key belongs and used flat
# `apikey=...` syntax, which Foundry doesn't parse - this is the fixed shape.
[etherscan]
testnet = { key = "${BOTCHAIN_API_KEY}", url = "https://scan.bohr.life/api" }
mainnet = { key = "${BOTCHAIN_API_KEY}", url = "https://scan.botchain.ai/api" }

[rpc_endpoints]
testnet = "https://rpc.bohr.life"
mainnet = "https://rpc.botchain.ai"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options